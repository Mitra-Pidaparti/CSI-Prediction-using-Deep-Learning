[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-reconstruction"
version = "0.1.0"
description = "Lightweight CNN experiments for compressed CSI reconstruction"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
csi-train = "csi_reconstruction.train:main"
csi-evaluate = "csi_reconstruction.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
